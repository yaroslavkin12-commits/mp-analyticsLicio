#cloud-config
# Вставляется в поле «Пользовательские данные» (user-data) при создании сервера в Yandex Cloud.
# Значения после «=» берутся из Render → Environment. Это поле видно только администраторам облака.
write_files:
  - path: /etc/mp/env.user
    permissions: '0600'
    content: |
      DOMAIN=defly-analytics.ru
      ADMIN_LOGIN=evgeniy
      ADMIN_PASSWORD=ПРИДУМАЙТЕ_ПАРОЛЬ_ОТ_8_СИМВОЛОВ
      NEON_DATABASE_URL=ЗНАЧЕНИЕ_DATABASE_URL_ИЗ_RENDER
      # дальше — остальные настройки из Render, по одной в строке: ИМЯ=значение
runcmd:
  - [bash, -c, "curl -fsSL https://raw.githubusercontent.com/yaroslavkin12-commits/mp-analyticsLicio/main/deploy/yandex/bootstrap.sh -o /root/mp-bootstrap.sh && bash /root/mp-bootstrap.sh"]
