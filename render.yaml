services:
  - type: web
    name: mp-analytics
    runtime: node
    rootDir: .
    buildCommand: npm install --prefix backend && npm install --prefix dashboard && cd dashboard && npm run build
    startCommand: node backend/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mp-analytics-db
          property: connectionString
      - key: WB_ENABLED
        value: "true"
      - key: WB_TOKEN
        sync: false
      - key: OZON_ENABLED
        value: "true"
      - key: OZON_CLIENT_ID
        sync: false
      - key: OZON_API_KEY
        sync: false
      - key: OZON_PERF_CLIENT_ID
        sync: false
      - key: OZON_PERF_SECRET
        sync: false
      - key: COLLECT_INTERVAL_HOURS
        value: "2"

databases:
  - name: mp-analytics-db
    plan: free
    databaseName: marketplace
