services:
  - type: web
    name: mp-analytics
    runtime: node
    buildCommand: cd backend && npm install && cd ../dashboard && npm install && npm run build && cd ..
    startCommand: node backend/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: WB_ENABLED
        value: "true"
      - key: WB_TOKEN
        sync: false
      - key: OZON_ENABLED
        value: "true"
      - key: OZON_CLIENT_ID
        sync: false
      - key: OZON_API_KEY
        sync: false
      - key: OZON_PERF_CLIENT_ID
        sync: false
      - key: OZON_PERF_SECRET
        sync: false
      - key: COLLECT_INTERVAL_HOURS
        value: "2"
