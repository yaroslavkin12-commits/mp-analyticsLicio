<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
  body{font:13px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;width:320px;margin:0;padding:14px;color:#151a23}
  h1{font-size:15px;margin:0 0 8px}
  .muted{color:#6b7280;font-size:12px}
  .row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid #eceef2}
  .bad{color:#c4321f}.ok{color:#16804a}
  button{margin-top:10px;width:100%;padding:8px;border:0;border-radius:8px;background:#5b5bd6;color:#fff;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6}
  input{width:100%;box-sizing:border-box;margin-top:4px;padding:6px 8px;border:1px solid #d3d8e0;border-radius:7px;font-size:12px}
  details{margin-top:10px}
</style></head>
<body>
  <h1>Соинвест Ozon</h1>
  <div class="muted">Раз в час берёт цены на витрине из кабинета seller.ozon.ru (нужно быть в нём залогиненным) и отправляет в сервис.</div>
  <div id="status" style="margin-top:10px"></div>
  <button id="run">Собрать сейчас</button>
  <details><summary class="muted">Адрес сервиса</summary><input id="server"></details>
  <script src="popup.js"></script>
</body></html>
